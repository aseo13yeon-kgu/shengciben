<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生词本 · 중국어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F2A44;
    --navy-soft: #2E3B5C;
    --bg: #FAFAF9;
    --card: #FFFFFF;
    --row-alt: #F3F4F7;
    --ink: #24252A;
    --ink-soft: #8C8C87;
    --line: #E6E6E3;
    --pinyin: #9497A0;
    --danger: #B4564D;
    --danger-soft: #F6E9E7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    min-height: 100vh;
  }

  .header-band {
    background: var(--navy);
    color: #FFFFFF;
    padding: 28px 16px;
    text-align: center;
  }

  .header-band .zh {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .header-band .ko {
    margin-top: 4px;
    font-size: 13px;
    color: #C4CADA;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 24px 16px 60px;
  }

  .notebook-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .notebook-select {
    flex: 1;
    min-width: 0;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }

  .notebook-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .icon-btn:hover {
    border-color: var(--navy-soft);
    color: var(--navy);
  }

  .form-card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .field input {
    width: 100%;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .field input#hanziInput {
    font-family: "Noto Serif SC", serif;
    font-size: 18px;
  }

  .field input:focus {
    border-color: var(--navy-soft);
    background: var(--card);
  }

  .add-btn {
    margin-top: 4px;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 0;
    border: 1px solid var(--navy);
    border-radius: 8px;
    background: var(--navy);
    color: #FFFFFF;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .add-btn:hover {
    background: var(--navy-soft);
  }

  .add-btn:active {
    transform: translateY(1px);
  }

  .search-field input {
    width: 100%;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-field input:focus {
    border-color: var(--navy-soft);
  }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px;
    gap: 10px;
  }

  .list-header .count {
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .hide-toggle {
    font-family: "Noto Sans KR", sans-serif;
    font-size: 12px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .hide-toggle.active {
    background: var(--navy);
    color: #FFFFFF;
    border-color: var(--navy);
  }

  .hide-toggle:hover {
    border-color: var(--navy-soft);
  }

  .io-bar {
    display: flex;
    gap: 8px;
  }

  .io-btn {
    flex: 1;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 13px;
    padding: 9px 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .io-btn:hover {
    border-color: var(--navy-soft);
    color: var(--navy);
  }

  .list {
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card);
  }

  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .item:last-child {
    border-bottom: none;
  }

  .item:nth-child(even) {
    background: var(--row-alt);
  }

  .item.checked {
    opacity: 0.5;
  }

  .item.checked .hanzi,
  .item.checked .meaning {
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }

  .check-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--line);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 13px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .check-btn.on {
    background: var(--navy);
    border-color: var(--navy);
  }

  .hanzi {
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    min-width: 58px;
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .pinyin {
    font-family: "Noto Serif SC", serif;
    font-size: 12px;
    color: var(--pinyin);
  }

  .meaning {
    font-size: 14px;
    color: var(--ink);
    margin-top: 2px;
    word-break: keep-all;
  }

  .edit-btn,
  .del-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .edit-btn:hover {
    background: var(--row-alt);
    color: var(--navy);
    border-color: var(--navy-soft);
  }

  .del-btn:hover {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: var(--danger-soft);
  }

  .edit-row {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .edit-row input {
    width: 100%;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }

  .edit-row input.edit-hanzi {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
  }

  .edit-row input:focus {
    border-color: var(--navy-soft);
    background: var(--card);
  }

  .edit-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .edit-actions button {
    font-family: "Noto Sans KR", sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
  }

  .save-btn {
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #FFFFFF;
  }

  .cancel-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="header-band">
  <div class="zh">生词本</div>
  <div class="ko">중국어 단어장</div>
</div>

<div class="stage">
  <div class="notebook-bar">
    <select class="notebook-select" id="notebookSelect"></select>
    <div class="notebook-actions">
      <button class="icon-btn" id="addNotebookBtn" title="새 단어장">+</button>
      <button class="icon-btn" id="renameNotebookBtn" title="이름 변경">✎</button>
      <button class="icon-btn" id="deleteNotebookBtn" title="삭제">🗑</button>
    </div>
  </div>

  <div class="form-card">
    <div class="field">
      <label for="hanziInput">한자</label>
      <input type="text" id="hanziInput" placeholder="예: 谢谢">
    </div>
    <div class="field">
      <label for="pinyinInput">병음</label>
      <input type="text" id="pinyinInput" placeholder="예: xièxie">
    </div>
    <div class="field">
      <label for="meaningInput">한국어 뜻</label>
      <input type="text" id="meaningInput" placeholder="예: 고맙습니다">
    </div>
    <button class="add-btn" id="addBtn">추가</button>
  </div>

  <div class="search-field">
    <input type="text" id="searchInput" placeholder="한자 또는 한국어 뜻으로 검색">
  </div>

  <div class="list-header">
    <span class="count" id="countLabel">0개</span>
    <button class="hide-toggle" id="hideToggle">✓ 외운 단어 숨기기</button>
  </div>

  <div class="io-bar">
    <button class="io-btn" id="exportBtn">내보내기</button>
    <button class="io-btn" id="importBtn">가져오기</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
  const NOTEBOOKS_KEY = "zh-vocab-notebooks";
  const CURRENT_KEY = "zh-vocab-current-notebook";
  const LEGACY_KEY = "zh-vocab-list";

  const notebookSelect = document.getElementById("notebookSelect");
  const addNotebookBtn = document.getElementById("addNotebookBtn");
  const renameNotebookBtn = document.getElementById("renameNotebookBtn");
  const deleteNotebookBtn = document.getElementById("deleteNotebookBtn");
  const hanziInput = document.getElementById("hanziInput");
  const pinyinInput = document.getElementById("pinyinInput");
  const meaningInput = document.getElementById("meaningInput");
  const addBtn = document.getElementById("addBtn");
  const listEl = document.getElementById("list");
  const countLabel = document.getElementById("countLabel");
  const searchInput = document.getElementById("searchInput");
  const hideToggle = document.getElementById("hideToggle");
  const exportBtn = document.getElementById("exportBtn");
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");

  let searchQuery = "";
  let hideChecked = false;
  let editingId = null;

  function uid() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  }

  const DEFAULT_WORDS = [
    { hanzi: "恰当", pinyin: "qiàdàng", meaning: "적절하다, 알맞다" },
    { hanzi: "潜力", pinyin: "qiánlì", meaning: "잠재력" },
    { hanzi: "妥协", pinyin: "tuǒxié", meaning: "타협하다" },
    { hanzi: "频繁", pinyin: "pínfán", meaning: "빈번하다" },
    { hanzi: "岁月", pinyin: "suìyuè", meaning: "세월" },
    { hanzi: "履行", pinyin: "lǚxíng", meaning: "이행하다, 실행하다" },
    { hanzi: "侦探", pinyin: "zhēntàn", meaning: "탐정" },
    { hanzi: "眷恋", pinyin: "juànliàn", meaning: "그리워하다, 연연해하다" },
    { hanzi: "泛滥", pinyin: "fànlàn", meaning: "범람하다, 남발하다" },
    { hanzi: "蕴藏", pinyin: "yùncáng", meaning: "매장되다, 내포하다" }
  ];

  function buildDefaultWords() {
    return DEFAULT_WORDS.map((w) => ({ id: uid(), ...w, checked: false }));
  }

  function migrateLegacyWords() {
    try {
      const raw = localStorage.getItem(LEGACY_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return null;
      return parsed.map((w) => ({
        id: w.id || uid(),
        hanzi: w.hanzi || "",
        pinyin: w.pinyin || "",
        meaning: w.meaning || "",
        checked: !!w.checked
      }));
    } catch (e) {
      return null;
    }
  }

  function loadNotebooks() {
    try {
      const raw = localStorage.getItem(NOTEBOOKS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {
      // fall through to defaults
    }

    const legacyWords = migrateLegacyWords();
    return [{ id: "default", name: "기본 단어장", words: legacyWords || buildDefaultWords() }];
  }

  let notebooks = loadNotebooks();
  let currentId = localStorage.getItem(CURRENT_KEY) || notebooks[0].id;
  if (!notebooks.some((nb) => nb.id === currentId)) {
    currentId = notebooks[0].id;
  }

  function saveNotebooks() {
    localStorage.setItem(NOTEBOOKS_KEY, JSON.stringify(notebooks));
    localStorage.setItem(CURRENT_KEY, currentId);
  }

  function getCurrentNotebook() {
    return notebooks.find((nb) => nb.id === currentId);
  }

  function renderNotebookSelect() {
    notebookSelect.innerHTML = notebooks
      .map((nb) => `<option value="${escapeAttr(nb.id)}"${nb.id === currentId ? " selected" : ""}>${escapeHtml(nb.name)}</option>`)
      .join("");
  }

  function getVisibleWords() {
    const nb = getCurrentNotebook();
    const q = searchQuery.trim().toLowerCase();
    return nb.words.filter((word) => {
      if (hideChecked && word.checked) return false;
      if (!q) return true;
      return (
        word.hanzi.toLowerCase().includes(q) ||
        word.meaning.toLowerCase().includes(q)
      );
    });
  }

  function render() {
    const nb = getCurrentNotebook();
    const total = nb.words.length;
    const checkedCount = nb.words.filter((w) => w.checked).length;
    const pct = total ? Math.round((checkedCount / total) * 100) : 0;
    countLabel.textContent = total === 0 ? "0개" : `${total}개 · 암기 ${checkedCount}개 (${pct}%)`;

    const visible = getVisibleWords();

    if (total === 0) {
      listEl.innerHTML = '<div class="empty">아직 추가된 단어가 없어요.<br>위 입력창에 단어를 추가해보세요.</div>';
      return;
    }

    if (visible.length === 0) {
      listEl.innerHTML = '<div class="empty">조건에 맞는 단어가 없어요.</div>';
      return;
    }

    listEl.innerHTML = "";
    visible.forEach((word) => {
      const item = document.createElement("div");

      if (word.id === editingId) {
        item.className = "item";
        item.innerHTML = `
          <div class="edit-row">
            <input type="text" class="edit-hanzi" value="${escapeAttr(word.hanzi)}" placeholder="한자">
            <input type="text" class="edit-pinyin" value="${escapeAttr(word.pinyin)}" placeholder="병음">
            <input type="text" class="edit-meaning" value="${escapeAttr(word.meaning)}" placeholder="한국어 뜻">
            <div class="edit-actions">
              <button class="cancel-btn" data-id="${word.id}">취소</button>
              <button class="save-btn" data-id="${word.id}">저장</button>
            </div>
          </div>
        `;
      } else {
        item.className = "item" + (word.checked ? " checked" : "");
        item.innerHTML = `
          <button class="check-btn${word.checked ? " on" : ""}" data-id="${word.id}" aria-label="외운 단어 체크">${word.checked ? "✓" : ""}</button>
          <div class="hanzi">${escapeHtml(word.hanzi)}</div>
          <div class="info">
            <div class="pinyin">${escapeHtml(word.pinyin)}</div>
            <div class="meaning">${escapeHtml(word.meaning)}</div>
          </div>
          <button class="edit-btn" data-id="${word.id}" aria-label="수정">✎</button>
          <button class="del-btn" data-id="${word.id}" aria-label="삭제">✕</button>
        `;
      }

      listEl.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function addWord() {
    const hanzi = hanziInput.value.trim();
    const pinyin = pinyinInput.value.trim();
    const meaning = meaningInput.value.trim();

    if (!hanzi && !pinyin && !meaning) {
      hanziInput.focus();
      return;
    }

    const nb = getCurrentNotebook();
    nb.words.push({
      id: uid(),
      hanzi,
      pinyin,
      meaning,
      checked: false
    });

    saveNotebooks();
    render();

    hanziInput.value = "";
    pinyinInput.value = "";
    meaningInput.value = "";
    hanziInput.focus();
  }

  function deleteWord(id) {
    const nb = getCurrentNotebook();
    nb.words = nb.words.filter((w) => w.id !== id);
    saveNotebooks();
    render();
  }

  function toggleChecked(id) {
    const nb = getCurrentNotebook();
    const word = nb.words.find((w) => w.id === id);
    if (word) {
      word.checked = !word.checked;
      saveNotebooks();
      render();
    }
  }

  function saveEdit(id, row) {
    const nb = getCurrentNotebook();
    const word = nb.words.find((w) => w.id === id);
    if (word) {
      word.hanzi = row.querySelector(".edit-hanzi").value.trim();
      word.pinyin = row.querySelector(".edit-pinyin").value.trim();
      word.meaning = row.querySelector(".edit-meaning").value.trim();
      saveNotebooks();
    }
    editingId = null;
    render();
  }

  addBtn.addEventListener("click", addWord);

  [hanziInput, pinyinInput, meaningInput].forEach((input) => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addWord();
      }
    });
  });

  listEl.addEventListener("click", (e) => {
    const delBtn = e.target.closest(".del-btn");
    if (delBtn) {
      deleteWord(delBtn.dataset.id);
      return;
    }
    const checkBtn = e.target.closest(".check-btn");
    if (checkBtn) {
      toggleChecked(checkBtn.dataset.id);
      return;
    }
    const editBtn = e.target.closest(".edit-btn");
    if (editBtn) {
      editingId = editBtn.dataset.id;
      render();
      return;
    }
    const cancelBtn = e.target.closest(".cancel-btn");
    if (cancelBtn) {
      editingId = null;
      render();
      return;
    }
    const saveBtn = e.target.closest(".save-btn");
    if (saveBtn) {
      saveEdit(saveBtn.dataset.id, saveBtn.closest(".edit-row"));
    }
  });

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    render();
  });

  hideToggle.addEventListener("click", () => {
    hideChecked = !hideChecked;
    hideToggle.classList.toggle("active", hideChecked);
    hideToggle.textContent = hideChecked ? "✓ 외운 단어 숨김 중" : "✓ 외운 단어 숨기기";
    render();
  });

  notebookSelect.addEventListener("change", (e) => {
    currentId = e.target.value;
    editingId = null;
    searchQuery = "";
    searchInput.value = "";
    saveNotebooks();
    render();
  });

  addNotebookBtn.addEventListener("click", () => {
    const name = prompt("새 단어장 이름을 입력하세요");
    if (!name || !name.trim()) return;
    const nb = { id: uid(), name: name.trim(), words: [] };
    notebooks.push(nb);
    currentId = nb.id;
    saveNotebooks();
    renderNotebookSelect();
    render();
  });

  renameNotebookBtn.addEventListener("click", () => {
    const nb = getCurrentNotebook();
    const name = prompt("단어장 이름 변경", nb.name);
    if (!name || !name.trim()) return;
    nb.name = name.trim();
    saveNotebooks();
    renderNotebookSelect();
  });

  deleteNotebookBtn.addEventListener("click", () => {
    if (notebooks.length <= 1) {
      alert("마지막 남은 단어장은 삭제할 수 없어요.");
      return;
    }
    const nb = getCurrentNotebook();
    if (!confirm(`"${nb.name}" 단어장을 삭제할까요? 안의 단어도 모두 사라져요.`)) return;
    notebooks = notebooks.filter((n) => n.id !== nb.id);
    currentId = notebooks[0].id;
    saveNotebooks();
    renderNotebookSelect();
    render();
  });

  exportBtn.addEventListener("click", () => {
    const nb = getCurrentNotebook();
    const data = JSON.stringify(nb.words, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${nb.name}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener("click", () => importFile.click());

  importFile.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("invalid format");

        const nb = getCurrentNotebook();
        parsed.forEach((w) => {
          nb.words.push({
            id: uid(),
            hanzi: w.hanzi || "",
            pinyin: w.pinyin || "",
            meaning: w.meaning || "",
            checked: !!w.checked
          });
        });

        saveNotebooks();
        render();
      } catch (err) {
        alert("가져오기 실패: JSON 형식을 확인해주세요.");
      }
    };
    reader.readAsText(file);
    importFile.value = "";
  });

  renderNotebookSelect();
  render();
</script>

</body>
</html>
