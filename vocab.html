<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生词本 · 중국어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F2A44;
    --navy-soft: #2E3B5C;
    --bg: #FAFAF9;
    --card: #FFFFFF;
    --row-alt: #F3F4F7;
    --ink: #24252A;
    --ink-soft: #8C8C87;
    --line: #E6E6E3;
    --pinyin: #9497A0;
    --danger: #B4564D;
    --danger-soft: #F6E9E7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    min-height: 100vh;
  }

  .header-band {
    background: var(--navy);
    color: #FFFFFF;
    padding: 28px 16px;
    text-align: center;
  }

  .header-band .zh {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .header-band .ko {
    margin-top: 4px;
    font-size: 13px;
    color: #C4CADA;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 24px 16px 60px;
  }

  .form-card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .field input {
    width: 100%;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .field input#hanziInput {
    font-family: "Noto Serif SC", serif;
    font-size: 18px;
  }

  .field input:focus {
    border-color: var(--navy-soft);
    background: var(--card);
  }

  .add-btn {
    margin-top: 4px;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 0;
    border: 1px solid var(--navy);
    border-radius: 8px;
    background: var(--navy);
    color: #FFFFFF;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .add-btn:hover {
    background: var(--navy-soft);
  }

  .add-btn:active {
    transform: translateY(1px);
  }

  .search-field input {
    width: 100%;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-field input:focus {
    border-color: var(--navy-soft);
  }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px;
    gap: 10px;
  }

  .list-header .count {
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .hide-toggle {
    font-family: "Noto Sans KR", sans-serif;
    font-size: 12px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .hide-toggle.active {
    background: var(--navy);
    color: #FFFFFF;
    border-color: var(--navy);
  }

  .hide-toggle:hover {
    border-color: var(--navy-soft);
  }

  .list {
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card);
  }

  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .item:last-child {
    border-bottom: none;
  }

  .item:nth-child(even) {
    background: var(--row-alt);
  }

  .item.checked {
    opacity: 0.5;
  }

  .item.checked .hanzi,
  .item.checked .meaning {
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }

  .check-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--line);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 13px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .check-btn.on {
    background: var(--navy);
    border-color: var(--navy);
  }

  .hanzi {
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    min-width: 58px;
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .pinyin {
    font-family: "Noto Serif SC", serif;
    font-size: 12px;
    color: var(--pinyin);
  }

  .meaning {
    font-size: 14px;
    color: var(--ink);
    margin-top: 2px;
    word-break: keep-all;
  }

  .del-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .del-btn:hover {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: var(--danger-soft);
  }
</style>
</head>
<body>

<div class="header-band">
  <div class="zh">生词本</div>
  <div class="ko">중국어 단어장</div>
</div>

<div class="stage">
  <div class="form-card">
    <div class="field">
      <label for="hanziInput">한자</label>
      <input type="text" id="hanziInput" placeholder="예: 谢谢">
    </div>
    <div class="field">
      <label for="pinyinInput">병음</label>
      <input type="text" id="pinyinInput" placeholder="예: xièxie">
    </div>
    <div class="field">
      <label for="meaningInput">한국어 뜻</label>
      <input type="text" id="meaningInput" placeholder="예: 고맙습니다">
    </div>
    <button class="add-btn" id="addBtn">추가</button>
  </div>

  <div class="search-field">
    <input type="text" id="searchInput" placeholder="한자 또는 한국어 뜻으로 검색">
  </div>

  <div class="list-header">
    <button class="hide-toggle" id="hideToggle">✓ 외운 단어 숨기기</button>
    <span class="count" id="countLabel">0개</span>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
  const STORAGE_KEY = "zh-vocab-list";

  const hanziInput = document.getElementById("hanziInput");
  const pinyinInput = document.getElementById("pinyinInput");
  const meaningInput = document.getElementById("meaningInput");
  const addBtn = document.getElementById("addBtn");
  const listEl = document.getElementById("list");
  const countLabel = document.getElementById("countLabel");
  const searchInput = document.getElementById("searchInput");
  const hideToggle = document.getElementById("hideToggle");

  let searchQuery = "";
  let hideChecked = false;

  function loadWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return parsed.map((w) => ({ checked: false, ...w }));
    } catch (e) {
      return [];
    }
  }

  function saveWords(words) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }

  let words = loadWords();

  function getVisibleWords() {
    const q = searchQuery.trim().toLowerCase();
    return words.filter((word) => {
      if (hideChecked && word.checked) return false;
      if (!q) return true;
      return (
        word.hanzi.toLowerCase().includes(q) ||
        word.meaning.toLowerCase().includes(q)
      );
    });
  }

  function render() {
    countLabel.textContent = words.length + "개";

    const visible = getVisibleWords();

    if (words.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 추가된 단어가 없어요.<br>위 입력창에 단어를 추가해보세요.</div>';
      return;
    }

    if (visible.length === 0) {
      listEl.innerHTML = '<div class="empty">조건에 맞는 단어가 없어요.</div>';
      return;
    }

    listEl.innerHTML = "";
    visible.forEach((word) => {
      const item = document.createElement("div");
      item.className = "item" + (word.checked ? " checked" : "");
      item.innerHTML = `
        <button class="check-btn${word.checked ? " on" : ""}" data-id="${word.id}" aria-label="외운 단어 체크">${word.checked ? "✓" : ""}</button>
        <div class="hanzi">${escapeHtml(word.hanzi)}</div>
        <div class="info">
          <div class="pinyin">${escapeHtml(word.pinyin)}</div>
          <div class="meaning">${escapeHtml(word.meaning)}</div>
        </div>
        <button class="del-btn" data-id="${word.id}" aria-label="삭제">✕</button>
      `;
      listEl.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function addWord() {
    const hanzi = hanziInput.value.trim();
    const pinyin = pinyinInput.value.trim();
    const meaning = meaningInput.value.trim();

    if (!hanzi && !pinyin && !meaning) {
      hanziInput.focus();
      return;
    }

    words.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      hanzi,
      pinyin,
      meaning,
      checked: false
    });

    saveWords(words);
    render();

    hanziInput.value = "";
    pinyinInput.value = "";
    meaningInput.value = "";
    hanziInput.focus();
  }

  function deleteWord(id) {
    words = words.filter((w) => w.id !== id);
    saveWords(words);
    render();
  }

  function toggleChecked(id) {
    const word = words.find((w) => w.id === id);
    if (word) {
      word.checked = !word.checked;
      saveWords(words);
      render();
    }
  }

  addBtn.addEventListener("click", addWord);

  [hanziInput, pinyinInput, meaningInput].forEach((input) => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addWord();
      }
    });
  });

  listEl.addEventListener("click", (e) => {
    const delBtn = e.target.closest(".del-btn");
    if (delBtn) {
      deleteWord(delBtn.dataset.id);
      return;
    }
    const checkBtn = e.target.closest(".check-btn");
    if (checkBtn) {
      toggleChecked(checkBtn.dataset.id);
    }
  });

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    render();
  });

  hideToggle.addEventListener("click", () => {
    hideChecked = !hideChecked;
    hideToggle.classList.toggle("active", hideChecked);
    hideToggle.textContent = hideChecked ? "✓ 외운 단어 숨김 중" : "✓ 외운 단어 숨기기";
    render();
  });

  render();
</script>

</body>
</html>
